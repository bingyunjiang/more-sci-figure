<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2400" height="1500" viewBox="0 0 2400 1500">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#ECE7DD"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5483F"/>
      <stop offset="0.48" stop-color="#E5483F"/>
      <stop offset="0.52" stop-color="#126EAA"/>
      <stop offset="1" stop-color="#126EAA"/>
    </linearGradient>
    <filter id="ambient" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="34" flood-color="#4A4135" flood-opacity="0.11"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4A4135" flood-opacity="0.08"/>
    </filter>
    <clipPath id="sourceClip">
      <rect x="118" y="482" width="774" height="690" rx="22"/>
    </clipPath>
    <clipPath id="redrawClip">
      <rect x="1160" y="438" width="1122" height="772" rx="22"/>
    </clipPath>
    <pattern id="grain" width="86" height="86" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="16" r="1" fill="#3B3125" opacity="0.035"/>
      <circle cx="61" cy="49" r="0.8" fill="#3B3125" opacity="0.025"/>
      <circle cx="35" cy="75" r="0.7" fill="#3B3125" opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="2400" height="1500" fill="url(#paper)"/>
  <rect width="2400" height="1500" fill="url(#grain)"/>
  <rect x="78" y="56" width="2244" height="7" rx="3.5" fill="url(#hairline)"/>

  <text x="82" y="118" fill="#776F65" font-family="Avenir Next, PingFang SC, sans-serif"
        font-size="24" font-weight="600" letter-spacing="5">MORE SCI FIGURE / CASE 09</text>
  <text x="82" y="213" fill="#171A1C" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="68" font-weight="700">从论文图像，到可审计数据图</text>
  <text x="84" y="270" fill="#655F57" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="29">Fig. 9 · 厚度方向纤维取向张量</text>
  <text x="2318" y="230" text-anchor="end" fill="#D7D0C5"
        font-family="STIX Two Text, Georgia, serif" font-size="205" font-weight="600">09</text>

  <g filter="url(#ambient)">
    <rect x="78" y="338" width="854" height="1016" rx="40" fill="#E2DDD4"/>
    <rect x="1068" y="338" width="1254" height="1016" rx="40" fill="#D8D4CB"/>
  </g>
  <rect x="90" y="350" width="830" height="992" rx="31" fill="#FCFBF8"/>
  <rect x="1080" y="350" width="1230" height="992" rx="31" fill="#FFFFFF"/>

  <rect x="118" y="383" width="116" height="42" rx="21" fill="#EEE9E1"/>
  <text x="176" y="412" text-anchor="middle" fill="#4E4942"
        font-family="Avenir Next, PingFang SC, sans-serif" font-size="19" font-weight="700"
        letter-spacing="2">SOURCE</text>
  <text x="260" y="414" fill="#1C2022" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="31" font-weight="650">论文原图</text>

  <rect x="1118" y="383" width="130" height="42" rx="21" fill="#E5F0F5"/>
  <text x="1183" y="412" text-anchor="middle" fill="#126EAA"
        font-family="Avenir Next, PingFang SC, sans-serif" font-size="19" font-weight="700"
        letter-spacing="2">REDRAW</text>
  <text x="1272" y="414" fill="#1C2022" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="31" font-weight="650">数据提取与重绘</text>

  <rect x="112" y="476" width="786" height="702" rx="28" fill="#EEEAE3"/>
  <rect x="118" y="482" width="774" height="690" rx="22" fill="#FFFFFF"/>
  <image x="118" y="482" width="774" height="690" preserveAspectRatio="xMidYMid meet"
         clip-path="url(#sourceClip)"
         href="../fig9/figure-original.jpeg" xlink:href="../fig9/figure-original.jpeg"/>

  <rect x="1154" y="432" width="1134" height="784" rx="28" fill="#E8EEF0"/>
  <rect x="1160" y="438" width="1122" height="772" rx="22" fill="#FFFFFF"/>
  <image x="1160" y="438" width="1122" height="772" preserveAspectRatio="xMidYMid meet"
         clip-path="url(#redrawClip)"
         href="showcase-redraws/fig9-redraw.png" xlink:href="showcase-redraws/fig9-redraw.png"/>

  <g filter="url(#soft)">
    <circle cx="1000" cy="822" r="58" fill="#171A1C"/>
    <path d="M975 822h47m-15-16 16 16-16 16" fill="none" stroke="#F7F4EE"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1000" y="902" text-anchor="middle" fill="#81786D"
        font-family="Avenir Next, PingFang SC, sans-serif" font-size="17"
        font-weight="700" letter-spacing="2">DIGITIZE</text>

  <text x="118" y="1246" fill="#6F675D" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="22">PDF 内嵌原图 · 来源哈希锁定</text>
  <text x="1160" y="1254" fill="#126EAA" font-family="Avenir Next, PingFang SC, sans-serif"
        font-size="22" font-weight="650">330 DATA POINTS</text>
  <circle cx="1374" cy="1247" r="3.5" fill="#B9B2A8"/>
  <text x="1392" y="1254" fill="#625C54" font-family="Avenir Next, PingFang SC, sans-serif"
        font-size="22">6 SERIES</text>
  <circle cx="1520" cy="1247" r="3.5" fill="#B9B2A8"/>
  <text x="1538" y="1254" fill="#625C54" font-family="Avenir Next, PingFang SC, sans-serif"
        font-size="22">TABLE 3 CROSS-CHECK</text>

  <line x1="82" y1="1400" x2="2318" y2="1400" stroke="#CFC8BD" stroke-width="1.5"/>
  <text x="82" y="1453" fill="#383B3C" font-family="PingFang SC, Avenir Next, sans-serif"
        font-size="24" font-weight="600">Dr.Jiang</text>
  <text x="217" y="1453" fill="#81796F" font-family="Avenir Next, PingFang SC, sans-serif"
        font-size="22">Jiang &amp; Tian (2021)</text>
  <text x="1200" y="1453" text-anchor="middle" fill="#938A7F"
        font-family="PingFang SC, Avenir Next, sans-serif" font-size="20">候选数据 · 待人工复核</text>
  <text x="2318" y="1453" text-anchor="end" fill="#126EAA"
        font-family="Avenir Next, PingFang SC, sans-serif" font-size="22">github.com/bingyunjiang/more-sci-figure</text>
</svg>
