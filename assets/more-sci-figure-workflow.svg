<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1415" viewBox="0 0 1800 1415" role="img" aria-labelledby="title desc">
  <title id="title">More Sci Figure 从图源到可审计科研图表的完整工作流</title>
  <desc id="desc">展示图片或 PDF 证据提取、外部结构化数据直接重绘、人工复核门、论文级重绘、交付验证和四类独立状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef8f7"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b3b70"/>
      <stop offset="1" stop-color="#0d7490"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#12304a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1483a6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16844b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d83a3a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a43; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { font-size: 20px; font-weight: 600; fill: #486581; }
      .lane-title { font-size: 22px; font-weight: 800; fill: #fff; }
      .step-title { font-size: 24px; font-weight: 800; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; }
      .chip { font-size: 15px; font-weight: 700; }
      .decision { font-size: 20px; font-weight: 800; text-anchor: middle; }
      .edge { fill: none; stroke: #1483a6; stroke-width: 4; marker-end: url(#arrowBlue); }
      .edge-green { fill: none; stroke: #16844b; stroke-width: 4; marker-end: url(#arrowGreen); }
      .edge-red { fill: none; stroke: #d83a3a; stroke-width: 4; marker-end: url(#arrowRed); }
      .yes { font-size: 17px; font-weight: 800; fill: #16844b; }
      .no { font-size: 17px; font-weight: 800; fill: #d83a3a; }
      .ribbon-title { font-size: 20px; font-weight: 800; fill: #fff; }
      .ribbon-note { font-size: 16px; fill: #d9effb; }
      .ribbon-arrow { font-size: 28px; font-weight: 800; fill: #c6d8e8; }
      .footer { font-size: 17px; font-weight: 600; fill: #334e68; }
    </style>
  </defs>

  <rect width="1800" height="1415" rx="24" fill="url(#bg)"/>
  <text x="900" y="60" class="title" text-anchor="middle">More Sci Figure：从图源到可审计科研图表</text>
  <text x="900" y="96" class="subtitle" text-anchor="middle">本地优先 · 候选值与正式值分离 · 四类状态独立验证</text>

  <!-- Lane A -->
  <rect x="34" y="128" width="1732" height="690" rx="22" fill="#ffffff" stroke="#b7d9e8" stroke-width="2"/>
  <path d="M34 150 Q34 128 56 128 H565 V174 H34 Z" fill="url(#titleBar)"/>
  <text x="58" y="159" class="lane-title">流程 A：图片 / PDF 证据提取（人工门控）</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="64" y="198" width="300" height="160" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="91" cy="226" r="18" fill="#0f6fa3"/>
  <text x="91" y="233" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">1</text>
  <text x="119" y="234" class="step-title">检查并锁定来源</text>
  <text x="88" y="272" class="body">原始图片 / PDF</text>
  <text x="88" y="301" class="body">保留原文件，记录 SHA-256</text>
  <rect x="88" y="318" width="108" height="27" rx="13" fill="#d9effb"/>
  <text x="142" y="337" class="mono" text-anchor="middle">inspect</text>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="414" y="183" width="420" height="190" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="442" cy="212" r="18" fill="#0f6fa3"/>
  <text x="442" y="219" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">2</text>
  <text x="470" y="220" class="step-title">确认 project.json</text>
  <text x="442" y="257" class="body">图表类型：line / scatter / bar / histogram</text>
  <text x="442" y="287" class="body">绘图区、系列颜色、排除区域</text>
  <text x="442" y="317" class="body">linear / log10；每个数值轴 ≥ 2 个锚点</text>
  <text x="442" y="347" class="small" fill="#5b7083">不确定时在提取前停止</text>

  <!-- Decision 1 -->
  <polygon points="957,184 1063,278 957,372 851,278" fill="#fff8eb" stroke="#ed8b23" stroke-width="3"/>
  <text x="957" y="268" class="decision">规格完整、</text>
  <text x="957" y="296" class="decision">来源一致？</text>

  <!-- Stop 1 -->
  <g filter="url(#shadow)">
    <rect x="1192" y="210" width="355" height="135" rx="18" fill="#fff4f3" stroke="#d83a3a" stroke-width="2.5"/>
  </g>
  <circle cx="1227" cy="248" r="20" fill="#d83a3a"/>
  <text x="1227" y="256" font-size="24" font-weight="900" text-anchor="middle" fill="#fff">!</text>
  <text x="1260" y="250" class="step-title" fill="#a61b1b">拒绝数值提取</text>
  <text x="1222" y="286" class="body">只返回诊断，不生成正式数值</text>
  <text x="1222" y="316" class="small">修正规格或来源后重新 inspect</text>

  <path d="M364 278 H414" class="edge"/>
  <path d="M834 278 H851" class="edge"/>
  <path d="M1063 278 H1192" class="edge-red"/>
  <text x="1110" y="263" class="no">否</text>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="64" y="446" width="580" height="205" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="92" cy="475" r="18" fill="#0f6fa3"/>
  <text x="92" y="482" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">3</text>
  <text x="120" y="483" class="step-title">提取可见候选值</text>
  <rect x="485" y="460" width="118" height="27" rx="13" fill="#d9effb"/>
  <text x="544" y="479" class="mono" text-anchor="middle">extract</text>
  <text x="91" y="525" class="body">输出候选数据、证据叠图、质量报告与本地复核页</text>
  <text x="91" y="559" class="mono">candidates.csv + overlay.png</text>
  <text x="91" y="589" class="mono">extraction-report.json + review.html</text>
  <text x="91" y="624" class="small" fill="#5b7083">算法候选值 ≠ 正式数据</text>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="704" y="446" width="370" height="205" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="733" cy="475" r="18" fill="#0f6fa3"/>
  <text x="733" y="482" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">4</text>
  <text x="761" y="483" class="step-title">自动质量门</text>
  <text x="733" y="526" class="body">标定残差、曲线覆盖率</text>
  <text x="733" y="556" class="body">最大缺口、组件与形状质量</text>
  <rect x="733" y="592" width="219" height="31" rx="15" fill="#d9effb"/>
  <text x="842" y="613" class="chip" text-anchor="middle">extraction_status</text>

  <!-- Decision 2 -->
  <polygon points="1220,454 1318,548 1220,642 1122,548" fill="#fff8eb" stroke="#ed8b23" stroke-width="3"/>
  <text x="1220" y="539" class="decision">候选通过</text>
  <text x="1220" y="567" class="decision">质量门？</text>

  <!-- Stop 2 -->
  <g filter="url(#shadow)">
    <rect x="1420" y="486" width="310" height="125" rx="18" fill="#fff4f3" stroke="#d83a3a" stroke-width="2.5"/>
  </g>
  <circle cx="1453" cy="523" r="19" fill="#d83a3a"/>
  <text x="1453" y="531" font-size="23" font-weight="900" text-anchor="middle" fill="#fff">!</text>
  <text x="1483" y="526" class="step-title" fill="#a61b1b">停止并修正</text>
  <text x="1450" y="563" class="body">检查锚点、颜色或来源</text>
  <text x="1450" y="589" class="small">重新提取，不得绕过质量门</text>

  <path d="M957 372 V412 H354 V446" class="edge-green"/>
  <text x="973" y="403" class="yes">是</text>
  <path d="M644 548 H704" class="edge"/>
  <path d="M1074 548 H1122" class="edge"/>
  <path d="M1318 548 H1420" class="edge-red"/>
  <text x="1360" y="533" class="no">否</text>

  <!-- Step 5 -->
  <g filter="url(#shadow)">
    <rect x="64" y="690" width="760" height="100" rx="18" fill="#fff9ef" stroke="#ed8b23" stroke-width="2.5"/>
  </g>
  <circle cx="92" cy="719" r="18" fill="#d9750b"/>
  <text x="92" y="726" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">5</text>
  <text x="120" y="727" class="step-title">人工逐项复核</text>
  <text x="120" y="758" class="small">打开 review.html，逐项接受 / 拒绝并填写理由</text>
  <text x="120" y="781" class="small">导出 review-decisions.json；候选哈希绑定 + 覆盖全部候选</text>
  <rect x="598" y="703" width="133" height="28" rx="14" fill="#ffe5bd"/>
  <text x="665" y="723" class="mono" text-anchor="middle">review-apply</text>
  <rect x="598" y="747" width="170" height="28" rx="14" fill="#ffe5bd"/>
  <text x="683" y="767" class="chip" text-anchor="middle">review_status</text>

  <!-- Decision 3 -->
  <polygon points="1002,665 1104,740 1002,815 900,740" fill="#fff8eb" stroke="#ed8b23" stroke-width="3"/>
  <text x="1002" y="731" class="decision">接受项存在且</text>
  <text x="1002" y="759" class="decision">哈希匹配？</text>

  <!-- data / stop -->
  <rect x="1210" y="677" width="300" height="78" rx="16" fill="#f1fbf5" stroke="#16844b" stroke-width="2.5"/>
  <text x="1360" y="709" class="step-title" text-anchor="middle" fill="#126b3d">正式 data.csv</text>
  <text x="1360" y="738" class="body" text-anchor="middle">仅包含人工接受项</text>
  <rect x="1210" y="768" width="300" height="48" rx="14" fill="#fff4f3" stroke="#d83a3a" stroke-width="2"/>
  <text x="1360" y="799" class="body" text-anchor="middle" fill="#a61b1b">否：不生成 data.csv</text>

  <path d="M1220 642 V670 H824 V690" class="edge-green"/>
  <text x="1237" y="670" class="yes">通过 / 部分通过</text>
  <path d="M824 740 H900" class="edge"/>
  <path d="M1104 716 H1210" class="edge-green"/>
  <text x="1147" y="701" class="yes">是</text>
  <path d="M1104 765 H1210" class="edge-red"/>
  <text x="1147" y="792" class="no">否</text>

  <!-- Lane B -->
  <rect x="34" y="850" width="1732" height="150" rx="22" fill="#ffffff" stroke="#b7d9e8" stroke-width="2"/>
  <path d="M34 872 Q34 850 56 850 H500 V894 H34 Z" fill="#14638c"/>
  <text x="58" y="880" class="lane-title">流程 B：外部结构化数据直接重绘</text>
  <rect x="72" y="917" width="360" height="58" rx="14" fill="#f4faff" stroke="#1887b0" stroke-width="2"/>
  <text x="252" y="942" class="body" text-anchor="middle">CSV / TSV / JSON / XLSX / XLSM</text>
  <text x="252" y="964" class="small" text-anchor="middle">保留原始数据并记录哈希</text>
  <rect x="550" y="917" width="300" height="58" rx="14" fill="#f4faff" stroke="#1887b0" stroke-width="2"/>
  <text x="700" y="953" class="step-title" text-anchor="middle">规范化 data.csv</text>
  <rect x="960" y="909" width="480" height="73" rx="14" fill="#f8f5ff" stroke="#7955b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1200" y="938" class="mono" text-anchor="middle">extraction_status = not_applicable</text>
  <text x="1200" y="967" class="mono" text-anchor="middle">review_status = not_applicable</text>
  <path d="M432 946 H550" class="edge"/>
  <path d="M850 946 H930 V832 H1360 V755" class="edge-green"/>

  <!-- Delivery path -->
  <rect x="34" y="1032" width="1732" height="174" rx="22" fill="#ffffff" stroke="#b7d9e8" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="70" y="1068" width="420" height="104" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="99" cy="1097" r="18" fill="#0f6fa3"/>
  <text x="99" y="1104" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">6</text>
  <text x="127" y="1105" class="step-title">论文级重绘</text>
  <text x="99" y="1138" class="body">同一图形对象导出 PNG / SVG / PDF</text>
  <text x="99" y="1162" class="small">不擅自添加误差条、显著性、拟合或平滑</text>
  <rect x="341" y="1082" width="105" height="27" rx="13" fill="#d9effb"/>
  <text x="394" y="1101" class="mono" text-anchor="middle">render</text>

  <g filter="url(#shadow)">
    <rect x="600" y="1068" width="465" height="104" rx="18" fill="#f4faff" stroke="#1887b0" stroke-width="2.5"/>
  </g>
  <circle cx="629" cy="1097" r="18" fill="#0f6fa3"/>
  <text x="629" y="1104" font-size="20" font-weight="800" text-anchor="middle" fill="#fff">7</text>
  <text x="657" y="1105" class="step-title">交付验证</text>
  <text x="629" y="1138" class="body">哈希、清单、产物完整性、可选参考图残差</text>
  <text x="629" y="1162" class="small">输出 validation-report.json 与可选残差热图</text>
  <rect x="923" y="1082" width="105" height="27" rx="13" fill="#d9effb"/>
  <text x="976" y="1101" class="mono" text-anchor="middle">validate</text>

  <g filter="url(#shadow)">
    <rect x="1182" y="1068" width="520" height="104" rx="18" fill="#effbf4" stroke="#16844b" stroke-width="3"/>
  </g>
  <text x="1442" y="1110" font-size="28" font-weight="800" text-anchor="middle" fill="#126b3d">可审计交付包 evidence/</text>
  <text x="1442" y="1143" class="body" text-anchor="middle">render/* + manifest.json + validation-report.json</text>
  <text x="1442" y="1167" class="small" text-anchor="middle">delivery_status 独立反映交付完整性</text>
  <path d="M1360 816 V1017 H280 V1068" class="edge-green"/>
  <path d="M490 1120 H600" class="edge"/>
  <path d="M1065 1120 H1182" class="edge-green"/>

  <!-- Independent status ribbon -->
  <rect x="34" y="1238" width="1732" height="92" rx="20" fill="#0e365f"/>
  <text x="62" y="1274" class="ribbon-title">独立状态，不得越级</text>
  <text x="62" y="1302" class="ribbon-note">重绘成功不能提升不确定的提取或复核状态</text>
  <rect x="420" y="1255" width="245" height="56" rx="15" fill="#eaf6fd"/>
  <text x="542" y="1280" class="chip" text-anchor="middle">extraction_status</text>
  <text x="542" y="1301" class="tiny" text-anchor="middle">可见候选值与质量门</text>
  <rect x="705" y="1255" width="225" height="56" rx="15" fill="#fff4df"/>
  <text x="818" y="1280" class="chip" text-anchor="middle">review_status</text>
  <text x="818" y="1301" class="tiny" text-anchor="middle">人工是否接受候选</text>
  <rect x="970" y="1255" width="225" height="56" rx="15" fill="#f1ecfb"/>
  <text x="1083" y="1280" class="chip" text-anchor="middle">render_status</text>
  <text x="1083" y="1301" class="tiny" text-anchor="middle">声明数据是否成功重绘</text>
  <rect x="1235" y="1255" width="235" height="56" rx="15" fill="#eaf8ef"/>
  <text x="1353" y="1280" class="chip" text-anchor="middle">delivery_status</text>
  <text x="1353" y="1301" class="tiny" text-anchor="middle">交付物与检查是否完整</text>
  <text x="680" y="1291" class="ribbon-arrow">→</text>
  <text x="945" y="1291" class="ribbon-arrow">→</text>
  <text x="1210" y="1291" class="ribbon-arrow">→</text>

  <!-- Author and repository -->
  <rect x="34" y="1350" width="1732" height="42" rx="14" fill="#ffffff" stroke="#b7d9e8" stroke-width="2"/>
  <text x="900" y="1377" class="footer" text-anchor="middle">
    作者：Dr.Jiang　·　GitHub：
    <a href="https://github.com/bingyunjiang/more-sci-figure" target="_blank">
      <tspan fill="#0f6fa3" text-decoration="underline">https://github.com/bingyunjiang/more-sci-figure</tspan>
    </a>
  </text>
</svg>
