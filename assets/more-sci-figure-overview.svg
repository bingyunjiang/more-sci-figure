<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">More Sci Figure 功能总览</title>
  <desc id="desc">展示图片或 PDF 与外部结构化数据两类输入、五项核心能力、人工复核门、多格式输出、可审计交付和四类独立状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf8f7"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c345f"/>
      <stop offset="1" stop-color="#0b6680"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#12304a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1684a6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#15824a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a43; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: 1px; }
      .subtitle { font-size: 21px; font-weight: 600; fill: #486581; }
      .input-title { font-size: 25px; font-weight: 800; }
      .card-title { font-size: 25px; font-weight: 800; text-anchor: middle; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
      .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .footer-text { font-size: 17px; font-weight: 600; fill: #fff; }
      .edge { fill: none; stroke: #1684a6; stroke-width: 5; marker-end: url(#arrowBlue); }
      .edge-green { fill: none; stroke: #15824a; stroke-width: 5; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1800" height="1040" rx="24" fill="url(#bg)"/>
  <text x="900" y="64" class="title" text-anchor="middle">More Sci Figure 功能总览</text>
  <text x="900" y="103" class="subtitle" text-anchor="middle">本地优先 · 证据可追溯 · 科研图表提取与论文级重绘</text>

  <!-- Input: image / PDF -->
  <g filter="url(#shadow)">
    <rect x="42" y="205" width="250" height="235" rx="20" fill="#f4faff" stroke="#1787b1" stroke-width="2.5"/>
  </g>
  <circle cx="92" cy="260" r="29" fill="#0f75a7"/>
  <path d="M79 246 H99 L108 255 V277 H79 Z M99 246 V255 H108" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="135" y="268" class="input-title">图片 / PDF</text>
  <text x="70" y="320" class="body">线图 · 散点图</text>
  <text x="70" y="351" class="body">柱图 · 直方图</text>
  <rect x="70" y="382" width="194" height="34" rx="17" fill="#d9effb"/>
  <text x="167" y="404" class="small" font-weight="700" text-anchor="middle">原图与来源哈希保留</text>

  <!-- Input: structured data -->
  <g filter="url(#shadow)">
    <rect x="42" y="525" width="250" height="160" rx="20" fill="#f1fbf5" stroke="#16844b" stroke-width="2.5"/>
  </g>
  <circle cx="91" cy="574" r="28" fill="#16844b"/>
  <path d="M78 561 H104 V587 H78 Z M78 570 H104 M87 561 V587 M96 561 V587" fill="none" stroke="#fff" stroke-width="2.5"/>
  <text x="130" y="568" class="input-title">结构化数据</text>
  <text x="70" y="619" class="body">CSV / TSV / JSON</text>
  <text x="70" y="650" class="body">XLSX / XLSM</text>

  <!-- Capability 1 -->
  <g filter="url(#shadow)">
    <rect x="345" y="195" width="205" height="270" rx="20" fill="#f4faff" stroke="#1787b1" stroke-width="2.5"/>
  </g>
  <circle cx="448" cy="244" r="28" fill="#0f75a7"/>
  <path d="M436 244 V236 A12 12 0 0 1 460 236 V244 M432 244 H464 V265 H432 Z" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="448" y="307" class="card-title">来源锁定</text>
  <line x1="377" y1="327" x2="519" y2="327" stroke="#b7d9e8" stroke-width="2"/>
  <text x="448" y="365" class="body" text-anchor="middle">SHA-256 · 页面</text>
  <text x="448" y="398" class="body" text-anchor="middle">测量栅格</text>
  <text x="448" y="432" class="small" text-anchor="middle">来源不可静默替换</text>

  <!-- Capability 2 -->
  <g filter="url(#shadow)">
    <rect x="575" y="195" width="205" height="270" rx="20" fill="#f4faff" stroke="#1787b1" stroke-width="2.5"/>
  </g>
  <circle cx="678" cy="244" r="28" fill="#0f75a7"/>
  <path d="M662 253 C669 234 681 258 691 237 M658 260 H699" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="678" y="307" class="card-title">候选提取</text>
  <line x1="607" y1="327" x2="749" y2="327" stroke="#b7d9e8" stroke-width="2"/>
  <text x="678" y="365" class="body" text-anchor="middle">标定 · 曲线</text>
  <text x="678" y="398" class="body" text-anchor="middle">散点 · 柱图</text>
  <text x="678" y="432" class="small" text-anchor="middle">候选值并非正式数据</text>

  <!-- Capability 3 -->
  <g filter="url(#shadow)">
    <rect x="805" y="195" width="205" height="270" rx="20" fill="#fff8ed" stroke="#ed8b23" stroke-width="3"/>
  </g>
  <circle cx="908" cy="244" r="28" fill="#df790e"/>
  <path d="M895 251 A13 13 0 1 1 916 251 M889 266 C893 254 923 254 927 266 M918 256 L923 261 L932 249" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="908" y="307" class="card-title" fill="#b65a00">人工复核门</text>
  <line x1="837" y1="327" x2="979" y2="327" stroke="#efc58f" stroke-width="2"/>
  <text x="908" y="365" class="body" text-anchor="middle">哈希绑定</text>
  <text x="908" y="398" class="body" text-anchor="middle">逐项接受 / 拒绝</text>
  <text x="908" y="432" class="small" text-anchor="middle">接受项才进入 data.csv</text>

  <!-- Capability 4 -->
  <g filter="url(#shadow)">
    <rect x="1035" y="195" width="205" height="270" rx="20" fill="#f4faff" stroke="#1787b1" stroke-width="2.5"/>
  </g>
  <circle cx="1138" cy="244" r="28" fill="#0f75a7"/>
  <path d="M1120 260 V229 M1120 260 H1157 M1126 252 L1138 242 L1147 247 L1155 232" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1138" y="307" class="card-title">论文级重绘</text>
  <line x1="1067" y1="327" x2="1209" y2="327" stroke="#b7d9e8" stroke-width="2"/>
  <text x="1138" y="365" class="body" text-anchor="middle">保持曲线缺口</text>
  <text x="1138" y="398" class="body" text-anchor="middle">linear / log10</text>
  <text x="1138" y="432" class="small" text-anchor="middle">不擅自拟合或平滑</text>

  <!-- Capability 5 -->
  <g filter="url(#shadow)">
    <rect x="1265" y="195" width="205" height="270" rx="20" fill="#f4faff" stroke="#1787b1" stroke-width="2.5"/>
  </g>
  <circle cx="1368" cy="244" r="28" fill="#0f75a7"/>
  <path d="M1368 224 L1387 232 V247 C1387 260 1377 268 1368 273 C1359 268 1349 260 1349 247 V232 Z M1359 247 L1366 254 L1378 239" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1368" y="307" class="card-title">交付验证</text>
  <line x1="1297" y1="327" x2="1439" y2="327" stroke="#b7d9e8" stroke-width="2"/>
  <text x="1368" y="365" class="body" text-anchor="middle">哈希 · 清单</text>
  <text x="1368" y="398" class="body" text-anchor="middle">完整性 · 残差</text>
  <text x="1368" y="432" class="small" text-anchor="middle">独立验证交付状态</text>

  <!-- Auditable delivery -->
  <g filter="url(#shadow)">
    <rect x="1505" y="195" width="255" height="270" rx="20" fill="#effbf4" stroke="#16844b" stroke-width="3"/>
  </g>
  <circle cx="1633" cy="244" r="30" fill="#16844b"/>
  <path d="M1615 239 L1633 229 L1651 239 L1633 249 Z M1615 239 V258 L1633 269 L1651 258 V239 M1633 249 V269" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
  <text x="1633" y="307" class="card-title" fill="#126b3d">可审计交付包</text>
  <line x1="1540" y1="327" x2="1725" y2="327" stroke="#a8d7ba" stroke-width="2"/>
  <text x="1633" y="361" class="body" text-anchor="middle">data.csv</text>
  <text x="1633" y="393" class="body" text-anchor="middle">PNG · SVG · PDF</text>
  <text x="1633" y="425" class="small" text-anchor="middle">manifest.json</text>
  <text x="1633" y="448" class="small" text-anchor="middle">validation-report.json</text>

  <!-- Main path -->
  <path d="M292 330 H345" class="edge"/>
  <path d="M550 330 H575" class="edge"/>
  <path d="M780 330 H805" class="edge"/>
  <path d="M1010 330 H1035" class="edge"/>
  <path d="M1240 330 H1265" class="edge"/>
  <path d="M1470 330 H1505" class="edge-green"/>

  <!-- Direct data path -->
  <path d="M292 605 H940 Q965 605 965 580 V510 Q965 485 990 485 H1138 V465" class="edge-green"/>
  <rect x="450" y="574" width="276" height="42" rx="21" fill="#e8f8ef" stroke="#9acdad" stroke-width="1.5"/>
  <text x="588" y="601" class="body" font-weight="700" text-anchor="middle" fill="#126b3d">直接数据重绘</text>
  <rect x="757" y="574" width="320" height="42" rx="21" fill="#f8f5ff" stroke="#7955b8" stroke-width="1.5"/>
  <text x="917" y="600" class="small" text-anchor="middle" fill="#5f3b9c">提取 / 复核状态 = not_applicable</text>

  <!-- Independent statuses -->
  <rect x="42" y="745" width="1718" height="170" rx="22" fill="#ffffff" stroke="#b7d9e8" stroke-width="2"/>
  <text x="70" y="789" font-size="21" font-weight="800">四类状态独立</text>
  <text x="70" y="820" class="body">重绘成功不能提升不确定的提取或复核状态</text>
  <rect x="70" y="848" width="270" height="42" rx="16" fill="#eaf6fd" stroke="#1787b1" stroke-width="1.8"/>
  <text x="205" y="875" class="chip">extraction_status</text>
  <rect x="370" y="848" width="250" height="42" rx="16" fill="#fff4df" stroke="#ed8b23" stroke-width="1.8"/>
  <text x="495" y="875" class="chip">review_status</text>
  <rect x="650" y="848" width="250" height="42" rx="16" fill="#f1ecfb" stroke="#7955b8" stroke-width="1.8"/>
  <text x="775" y="875" class="chip">render_status</text>
  <rect x="930" y="848" width="260" height="42" rx="16" fill="#eaf8ef" stroke="#16844b" stroke-width="1.8"/>
  <text x="1060" y="875" class="chip">delivery_status</text>
  <text x="1260" y="861" class="body" font-weight="700">候选值 → 人工接受值 → 重绘产物 → 完整交付</text>
  <text x="1260" y="889" class="small">每一阶段单独记录，禁止用下游成功覆盖上游不确定性</text>

  <!-- Footer -->
  <rect x="42" y="942" width="1718" height="62" rx="18" fill="url(#footer)"/>
  <text x="900" y="980" class="footer-text" text-anchor="middle">
    作者：Dr.Jiang　·　GitHub：
    <a href="https://github.com/bingyunjiang/more-sci-figure" target="_blank">
      <tspan fill="#bcecff" text-decoration="underline">https://github.com/bingyunjiang/more-sci-figure</tspan>
    </a>
  </text>
</svg>
